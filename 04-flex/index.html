<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .flex-container {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            background-color: rgba(240, 248, 255, 0.5);
            box-shadow: 1px 2px 5px rgba(240, 248, 255, 0.8);
            border: 1px solid aliceblue;
            border-radius: 20px;
            padding: 20px 15px;
            height: 350px;
        }

        .emp-title {
            color: cornflowerblue;
            text-shadow: 1px 2px 5px rgba(100, 148, 237, 0.5);
            padding-inline-start: 15px;
        }

        .flex-item {
            text-align: center;
            justify-content: center;
            color: aliceblue;
            background-color: rgba(100, 148, 237, 0.5);
            box-shadow: 1px 2px 5px rgba(100, 148, 237, 0.3);
            border: 1px solid cornflowerblue;
            border-radius: 10px;
            font-size: 1.2rem;
            margin: 5px;
            padding: 10px;
            /* width: 30%; */
            /* height: 10%; */
        }
    </style>
</head>
<body>
    <h1 class="emp-title">Employees</h1>
    <div class="flex-container">
        <div class="flex-item">Employee 1</div>
        <div class="flex-item">Employee 2</div>
        <div class="flex-item">Employee 3</div>
    </div>
</body>
</html>
