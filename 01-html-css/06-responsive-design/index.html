<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .responsive-container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            justify-content: space-around;
            gap: 20px;
            background-color: rgba(128, 255, 212, 0.8);
            box-shadow: 1px 2px 5px rgba(128, 255, 212, 0.2);
            border: 1px solid aquamarine;
            border-radius: 15px;
            padding: 20px;
        }

        .box {
            color: lightblue;
            background-color: cadetblue;
            border-radius: 20px;
            box-shadow: 0px 0px 5px cadetblue;
            padding: 40px 20px;
            cursor: pointer;
            -ms-user-select: none;
            -webkit-user-select: none;
            user-select: none;
        }

        .box:hover, .box:active {
            background-color: rgb(95, 158, 160, 0.8);
        }

        .box:active {
            box-shadow: 0px 0px 3px cadetblue;
        }

        @media (max-width: 450px) {
            .responsive-container {
                display: flex;
                flex-direction: column;
            }
        }

        @media (min-width: 450px) and (max-width: 750px) {
            .responsive-container {
                grid-template-columns: 1fr 1fr;
            }

            .third-box {
                grid-column: 1 / span 2;
            }
        }
    </style>
</head>
<body>
    <div class="responsive-container">
        <div class="box">Box 1</div>
        <div class="box">Box 2</div>
        <div class="box third-box">Box 3</div>
    </div>
</body>
</html>
