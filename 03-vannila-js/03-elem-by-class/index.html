<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <a href="">Home Page</a>
    <ul>
        <li class="list-item">Coffee</li>
        <li class="list-item">Tea</li>
        <li class="list-item">Somthing</li>
        <li class="list-item">Milk</li>
        <li class="list-item">Water</li>
    </ul>
    <script>
        let listItems = document.getElementsByClassName("list-item")
        listItems[2].innerHTML = '<a href="https://www.google.com" target="_blank">Google</a>'
        for (let i = 0; i < listItems.length; i++) {
            if (i % 2 === 0) listItems[i].style.color = 'blue'
        }

        let listItemsByTag = document.getElementsByTagName("li")
        for (const item of listItemsByTag) {
            item.style.backgroundColor = 'aquamarine'
        }
    </script>
</body>

</html>
